blueprint:
  name: LU-Alert Allergen Alert Notification
  description: Sends a notification when an LU-Alert that mentions one of your allergens becomes active (the sensor "Allergen Match" turns on).
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    notification_device:
      name: Notification Device
      description: The device to send the notification to.
      selector:
        device:
          integration: mobile_app
    notification_channel:
      name: Notification Channel (Optional)
      description: The Android notification channel to use (for example "Alerts"). Leave empty for the default channel.
      default: ""

variables:
  notification_channel: !input notification_channel

triggers:
  - trigger: state
    entity_id: binary_sensor.lu_alert_allergen_match
    to: "on"

actions:
  - variables:
      allergen_alerts: "{{ state_attr('sensor.lu_alert', 'alerts') | selectattr('allergen_match', 'eq', true) | list }}"
  - repeat:
      for_each: "{{ allergen_alerts }}"
      sequence:
        - device_id: !input notification_device
          domain: mobile_app
          type: notify
          title: "⚠️ ALLERGEN ALERT: {{ repeat.item.event }}"
          message: "{{ repeat.item.headline }}"
          data: >-
            {{ {'channel': notification_channel, 'priority': 'high'} if notification_channel else {'priority': 'high'} }}
