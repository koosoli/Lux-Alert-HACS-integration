blueprint:
  name: LU-Alert Critical Alert Notification
  description: Sends a notification when a Severe or Extreme LU-Alert becomes active (the sensor "Critical Alert Active" turns on).
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    notification_device:
      name: Notification Device
      description: The device to send the notification to.
      selector:
        device:
          integration: mobile_app
    notification_channel:
      name: Notification Channel (Optional)
      description: The Android notification channel to use (for example "Alerts"). Leave empty for the default channel.
      default: ""

variables:
  notification_channel: !input notification_channel

triggers:
  - trigger: state
    entity_id: binary_sensor.lu_alert_critical_alert_active
    to: "on"

actions:
  - variables:
      alert: "{{ states.sensor.lu_alert_highest_severity.attributes }}"
  - device_id: !input notification_device
    domain: mobile_app
    type: notify
    title: "🚨 CRITICAL ALERT: {{ alert.severity }} - {{ alert.event }}"
    message: "{{ alert.headline }}"
    data: >-
      {{ {'channel': notification_channel, 'priority': 'high'} if notification_channel else {'priority': 'high'} }}
