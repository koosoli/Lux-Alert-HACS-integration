blueprint:
  name: LU-Alert Local Alert Notification
  description: Sends a notification when an LU-Alert that covers your location becomes active. Needs the location filter of the integration ("Flag local alerts" or "Only local alerts") to be on.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    notification_device:
      name: Notification Device
      description: The device to send the notification to.
      selector:
        device:
          integration: mobile_app
    notification_channel:
      name: Notification Channel (Optional)
      description: The Android notification channel to use (for example "Alerts"). Leave empty for the default channel.
      default: ""

variables:
  notification_channel: !input notification_channel

triggers:
  - trigger: state
    entity_id: binary_sensor.lu_alert_local_alert_active
    to: "on"

actions:
  - variables:
      local_alerts: "{{ state_attr('sensor.lu_alert', 'alerts') | selectattr('is_local', 'eq', true) | list }}"
  - repeat:
      for_each: "{{ local_alerts }}"
      sequence:
        - device_id: !input notification_device
          domain: mobile_app
          type: notify
          title: "📍 LOCAL ALERT: {{ repeat.item.severity }} - {{ repeat.item.event }}"
          message: "{{ repeat.item.headline }}"
          data: >-
            {{ {'channel': notification_channel, 'priority': 'high'} if notification_channel else {'priority': 'high'} }}
